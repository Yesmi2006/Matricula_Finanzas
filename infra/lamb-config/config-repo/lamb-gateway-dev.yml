server:
  port: 18080

spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:18180/realms/lamb
  cloud:
    loadbalancer:
      cache:
        ttl: 5s
    gateway:
      server:
        webmvc:
          routes:
            - id: lamb-personas
              uri: lb://lamb-personas-ms
              predicates:
                - Path=/api/v1/personas/**
            - id: lamb-institucional-facultades
              uri: lb://lamb-institucional-ms
              predicates:
                - Path=/api/v1/facultades/**
            - id: lamb-institucional-programas
              uri: lb://lamb-institucional-ms
              predicates:
                - Path=/api/v1/programas/**
            - id: lamb-planificacion-cursos
              uri: lb://lamb-planificacion-ms
              predicates:
                - Path=/api/v1/cursos/**
            - id: lamb-planificacion-secciones
              uri: lb://lamb-planificacion-ms
              predicates:
                - Path=/api/v1/secciones/**
            - id: lamb-admision
              uri: lb://lamb-admision-ms
              predicates:
                - Path=/api/v1/postulaciones/**
            - id: lamb-curriculo
              uri: lb://lamb-curriculo-ms
              predicates:
                - Path=/api/v1/planes-estudio/**
            - id: lamb-matricula
              uri: lb://lamb-matricula-ms
              predicates:
                - Path=/api/v1/matriculas/**
            - id: lamb-matricula-calendario-periodos
              uri: lb://lamb-matricula-ms
              predicates:
                - Path=/api/v1/calendario-periodos/**
            - id: lamb-matricula-reglas-requisitos
              uri: lb://lamb-matricula-ms
              predicates:
                - Path=/api/v1/reglas-requisitos/**
            - id: lamb-matricula-oferta-cupos
              uri: lb://lamb-matricula-ms
              predicates:
                - Path=/api/v1/oferta-cupos/**
            - id: lamb-matricula-situacion-estudiante
              uri: lb://lamb-matricula-ms
              predicates:
                - Path=/api/v1/situacion-estudiante/**
            - id: lamb-matricula-cursos-carga-academica
              uri: lb://lamb-matricula-ms
              predicates:
                - Path=/api/v1/cursos-carga-academica/**
            - id: lamb-matricula-rectificacion-retiro-reactivacion
              uri: lb://lamb-matricula-ms
              predicates:
                - Path=/api/v1/rectificacion-retiro-reactivacion/**
            - id: lamb-evaluacion
              uri: lb://lamb-evaluacion-ms
              predicates:
                - Path=/api/v1/notas/**
            - id: lamb-evaluacion-actas
              uri: lb://lamb-evaluacion-ms
              predicates:
                - Path=/api/v1/actas/**
            - id: lamb-trayectoria
              uri: lb://lamb-trayectoria-ms
              predicates:
                - Path=/api/v1/trayectorias/**
            - id: lamb-finanzas
              uri: lb://lamb-finanzas-ms
              predicates:
                - Path=/api/v1/pagos/**
            - id: lamb-finanzas-saldo-estudiante
              uri: lb://lamb-finanzas-ms
              predicates:
                - Path=/api/v1/saldo-estudiante/**
            - id: lamb-finanzas-catalogos-tarifas
              uri: lb://lamb-finanzas-ms
              predicates:
                - Path=/api/v1/catalogos-tarifas/**
            - id: lamb-finanzas-calendario-planes
              uri: lb://lamb-finanzas-ms
              predicates:
                - Path=/api/v1/calendario-planes/**
            - id: lamb-finanzas-descuentos-becas
              uri: lb://lamb-finanzas-ms
              predicates:
                - Path=/api/v1/descuentos-becas/**
            - id: lamb-finanzas-cobros
              uri: lb://lamb-finanzas-ms
              predicates:
                - Path=/api/v1/cobros/**
            - id: lamb-finanzas-comprobantes
              uri: lb://lamb-finanzas-ms
              predicates:
                - Path=/api/v1/comprobantes/**
            - id: lamb-finanzas-reembolsos-cancelaciones
              uri: lb://lamb-finanzas-ms
              predicates:
                - Path=/api/v1/reembolsos-cancelaciones/**
            - id: lamb-finanzas-control-cierre
              uri: lb://lamb-finanzas-ms
              predicates:
                - Path=/api/v1/control-cierre/**

eureka:
  instance:
    hostname: localhost
    instance-id: ${spring.application.name}:${server.port}
  client:
    registry-fetch-interval-seconds: 5
    service-url:
      defaultZone: http://localhost:18761/eureka

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
