<form class="resource-form" [formGroup]="form" (ngSubmit)="onSubmit()">
  <h3>{{ value ? 'Editar' : 'Nuevo' }} · {{ config.label }}</h3>

  <div class="resource-form__grid">
    @for (field of visibleFields(); track field.key) {
      <label class="resource-form__field">
        <span>{{ field.label }}</span>

        @switch (field.type) {
          @case ('boolean') {
            <input type="checkbox" [formControlName]="field.key" />
          }
          @case ('textarea') {
            <textarea [formControlName]="field.key" rows="3"></textarea>
          }
          @case ('number') {
            <input type="number" [formControlName]="field.key" />
          }
          @case ('decimal') {
            <input type="number" step="0.01" [formControlName]="field.key" />
          }
          @case ('date') {
            <input type="date" [formControlName]="field.key" />
          }
          @case ('datetime') {
            <input type="datetime-local" [formControlName]="field.key" />
          }
          @default {
            <input type="text" [formControlName]="field.key" />
          }
        }
      </label>
    }
  </div>

  <div class="resource-form__actions">
    <button type="button" class="btn btn--ghost" (click)="cancel.emit()">Cancelar</button>
    <button type="submit" class="btn btn--primary">Guardar</button>
  </div>
</form>
